name: Offline quality gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SCANRUNNER_TEST_REAL_NMAP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-optional.txt
      - run: python scripts/check_quality.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/audit_safety.py
      - run: python -B scanrunner.py benchmark tests/fixtures/detection-benchmark/dataset.json --destination synthetic-benchmark-ci.json
      - run: python scanrunner.py --help
      - run: python install.py --help
